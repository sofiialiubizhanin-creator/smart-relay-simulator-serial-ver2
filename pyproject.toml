[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-relay-simulator"
version = "0.1.0"
description = "Smart relay simulator (serial-over-TCP) with a one-shot host CLI"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5,<4"]  # relay_host subclasses pyserial's socket:// handler

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-html>=4"]

[project.scripts]
relay-sim = "relay_sim.__main__:main"
relay-host = "relay_host.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["ac(*ids): Acceptance Criteria IDs covered by the test, e.g. ac('AC-F1-01')"]
